name: Build Release

# 触发：打 tag（如 v1.0.0）或手动在 Actions 页面触发
on:
  workflow_dispatch:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  Build:
    name: Release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # JDK 17（AGP 8.x 要求，且兼容本工程）
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 安装 Android SDK（提供 sdkmanager / ANDROID_HOME）
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # 安装编译所需的 SDK 包：compileSdk 32、build-tools 36.0.0、NDK 26.2、platform-tools
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-32" "build-tools;36.0.0" "ndk;26.2.11394342" "platform-tools"

      # 还原签名 keystore（build.gradle 的 release 用 ../keystore/GoGoGo.jks 自签名）
      - name: Decode signing keystore
        run: |
          mkdir -p keystore
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore/GoGoGo.jks

      # 重建 local.properties，提供百度地图 AK（secrets-gradle-plugin 读取并注入 BuildConfig）
      - name: Create local.properties
        run: |
          cat << EOF > local.properties
          MAPS_API_KEY=${{ secrets.MAPS_API_KEY }}
          MAPS_SAFE_CODE=${{ secrets.MAPS_SAFE_CODE }}
          EOF

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # assembleRelease 会用上面的 keystore 自签名产出已签名的 release APK
      - name: Build signed release APK
        run: bash ./gradlew assembleRelease --no-daemon

      # 将产物上传到 GitHub Releases
      - name: Release APK
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          token: ${{ github.token }}
          prerelease: false
          files: app/build/outputs/apk/release/*.apk
