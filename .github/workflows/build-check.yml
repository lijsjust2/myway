name: Build Check

# 每次 push / PR 到 main 时做一次编译校验（用 debug 包，无需 release keystore）
on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-32" "build-tools;36.0.0" "ndk;26.2.11394342" "platform-tools"

      # debug 编译也需要 AK 注入 BuildConfig（值为空也能通过编译，仅运行时地图不可用）
      - name: Create local.properties
        run: |
          cat << EOF > local.properties
          MAPS_API_KEY=${{ secrets.MAPS_API_KEY }}
          MAPS_SAFE_CODE=${{ secrets.MAPS_SAFE_CODE }}
          EOF

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 仅编译 debug，验证工程可构建（不依赖 release keystore，PR 来自 fork 也能跑）
      - name: Build debug APK
        run: bash ./gradlew assembleDebug --no-daemon
